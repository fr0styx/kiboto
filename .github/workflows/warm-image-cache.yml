name: Warm the image build cache

# The image takes Debian's packages anew once a day (APT_DAY in the Dockerfile), so the first build
# of a day rebuilt most layers. This builds both images for both architectures just after midnight
# UTC, into the registry cache CI reads, so the day's first push finds them. It pushes no image.
on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/fr0styx/kiboto

jobs:
  warm:
    name: Warm (${{ matrix.variant }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        variant: [full, core]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    permissions:
      contents: read
      packages: write # the build cache in the registry
    env:
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Which day's Debian packages
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build into the cache only
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=cacheonly
          build-args: |
            VARIANT=${{ matrix.variant }}
            APT_DAY=${{ steps.day.outputs.day }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
