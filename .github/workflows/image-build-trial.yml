name: Native arm64 build trial

# A trial before CI's image build changes: each architecture is built on a runner of its own
# (arm64 on GitHub's arm64 runners instead of under emulation on an x86 one), with Docker's build
# cache kept in the registry instead of the Actions cache (which is full and evicts layers), and
# the two halves are joined into one multi-architecture image by its digest, through the registry
# API, so no tag points at it. Started by hand only; it tags nothing that anything installs.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/fr0styx/kiboto

jobs:
  build-arch:
    name: Build (${{ matrix.variant }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        variant: [full, core]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    permissions:
      contents: read
      packages: write # the image by digest, and the build cache
    env:
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Which day's Debian packages
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VARIANT=${{ matrix.variant }}
            BUILD_COMMIT=${{ github.sha }}
            APT_DAY=${{ steps.day.outputs.day }}
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "::error::no image digest from the build"; exit 1;; esac
          mkdir -p part && echo "$DIGEST" > "part/$ARCH.txt"
      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trial-${{ matrix.variant }}-${{ matrix.arch }}
          path: part/
          retention-days: 3

  join:
    name: Join into one image (${{ matrix.variant }})
    needs: [build-arch]
    strategy:
      fail-fast: false
      matrix:
        variant: [full, core]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # the joined index, by digest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Download the two digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trial-${{ matrix.variant }}-*
          merge-multiple: true
          path: part
      - name: Join them, pushed by digest
        id: join
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          ls part
          refs=""
          for f in part/amd64.txt part/arm64.txt; do refs="$refs $IMAGE@$(cat "$f")"; done
          # shellcheck disable=SC2086
          # the tag is never pushed: --dry-run only prints the index this would push
          docker buildx imagetools create --dry-run -t "$IMAGE:not-pushed" $refs > index.json
          digest="sha256:$(sha256sum index.json | cut -d' ' -f1)"
          media=$(jq -r .mediaType index.json)
          token=$(curl -fsS -u "$ACTOR:$GH_TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:fr0styx/kiboto:pull,push" | jq -r .token)
          curl -fsS -X PUT -H "Authorization: Bearer $token" -H "Content-Type: $media" \
            --data-binary @index.json "https://ghcr.io/v2/fr0styx/kiboto/manifests/$digest" -o /dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "joined: $digest"
      - name: The joined image has both architectures and starts
        env:
          DIGEST: ${{ steps.join.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" | jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture) \(.annotations["vnd.docker.reference.type"] // "image")"'
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" | jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | (index("amd64") != null and index("arm64") != null)'
          docker pull -q "$IMAGE@$DIGEST"
          docker run --rm --entrypoint python3 "$IMAGE@$DIGEST" -c "import backend; print('starts:', backend.__version__)"
