name: Kiboto OS install check

# Installs Kiboto OS for real. A fresh Debian 13 starts as a virtual machine on the runner, this
# checkout's install script installs the build named by its digest, and the result is looked at,
# before and after a restart (scripts/os_install_check.sh). The repository's other tests about
# Kiboto OS read its scripts as text; this is the one that runs them.
# It can be started by hand for any published build, and CI calls it for the build it just made.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "The build to install: ghcr.io/fr0styx/kiboto@sha256:..."
        required: true
        type: string
      fast:
        description: "Start from a prepared disk with ZFS already built, when one for this install.sh exists"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      image:
        description: "The build to install, by digest. Empty: the full image the calling run built."
        required: false
        type: string
        default: ""
      fast:
        description: "Start from a prepared disk with ZFS already built, when one for this install.sh exists"
        required: false
        type: boolean
        default: false
      early:
        description: "Start with the calling run, not after its build: boot with the QEMU of the last :main build, then wait for this run's digest"
        required: false
        type: boolean
        default: false
      from_last_release:
        description: "Install the newest release before this one first, make a pool, a shared folder and a file, then update to the build and check they stayed"
        required: false
        type: boolean
        default: false
      secure_boot:
        description: "Start the machine with Secure Boot on: the machine's ZFS key is queued at the install and enrolled at the firmware's key manager at the restart"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  install:
    name: ${{ inputs.from_last_release && 'Kiboto OS updates from the last release' || inputs.secure_boot && 'Kiboto OS with Secure Boot' || 'Kiboto OS installs and runs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    permissions:
      contents: read
      packages: read # the image is pulled by its digest
      actions: read # early: the calling run's build job and its digest artifact
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: The runner can start virtual machines
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error title=No virtual machines here::This runner has no /dev/kvm, so Kiboto OS cannot be installed in a virtual machine on it."
            exit 1
          fi
          ls -l /dev/kvm

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the digest
        if: inputs.image == '' && !inputs.early
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-full

      - name: Which build
        id: build
        env:
          GIVEN: ${{ inputs.image }}
          EARLY: ${{ inputs.early && inputs.image == '' }}
        run: |
          if [ "$EARLY" = true ]; then
            # the build is still running: the check boots first and asks for the digest when it is up
            echo "image=--wait" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$GIVEN" ]; then image=$GIVEN; else image="ghcr.io/fr0styx/kiboto@$(cat digest.txt)"; fi
          # only one of Kiboto's own builds, named by its digest: nothing else is ever installed here
          if ! printf '%s' "$image" | grep -Eq '^ghcr\.io/fr0styx/kiboto@sha256:[0-9a-f]{64}$'; then
            echo "::error title=Not a Kiboto build::Name the build as ghcr.io/fr0styx/kiboto@sha256:<digest>."
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # The fast path: a disk on which ZFS is already built (the slowest part of an install) and the
      # installer's other packages are downloaded. It belongs to one install.sh, one version of this
      # check and one Debian cloud image: a change to any of them makes a new one, and that run does
      # the full fresh install, which is how an installer change is always tried from nothing.
      # the update a real machine takes: the newest published release before this one, by digest
      - name: Which earlier release
        if: inputs.from_last_release
        id: from
        run: |
          set -eu
          THIS="${GITHUB_REF_NAME#v}"
          tag=$(git ls-remote --tags --refs "https://github.com/${{ github.repository }}" 'v*' \
            | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$THIS" \
            | sort -t. -k1,1n -k2,2n -k3,3n | while read -r v; do
                docker buildx imagetools inspect "ghcr.io/fr0styx/kiboto:$v" >/dev/null 2>&1 && echo "$v"
              done | tail -1)
          [ -n "$tag" ] || { echo "::error title=No earlier release::no published release image to update from"; exit 1; }
          digest=$(docker buildx imagetools inspect "ghcr.io/fr0styx/kiboto:$tag" | awk '/^Digest:/ {print $2; exit}')
          case "$digest" in sha256:*) ;; *) echo "::error::no digest for $tag"; exit 1 ;; esac
          echo "updating from $tag ($digest)"
          echo "image=ghcr.io/fr0styx/kiboto@$digest" >> "$GITHUB_OUTPUT"

      - name: Which prepared disk fits
        if: inputs.fast
        id: key
        run: |
          set -euo pipefail
          debian=$(curl -fsSL --retry 5 --retry-delay 10 https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS \
            | grep ' debian-13-generic-amd64.qcow2$' | cut -c1-16)
          [ -n "$debian" ]
          ours=$(cat packaging/install.sh scripts/os_install_check.sh | sha256sum | cut -c1-16)
          echo "key=kb-os-prepared-v1-$ours-$debian" >> "$GITHUB_OUTPUT"

      - name: A prepared disk from an earlier run
        if: inputs.fast
        id: prepared
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: prepared.qcow2
          key: ${{ steps.key.outputs.key }}

      - name: Install Kiboto OS in a fresh Debian 13 and check it
        env:
          IMAGE_REF: ${{ steps.build.outputs.image }}
          KB_OS_PREPARED: ${{ steps.prepared.outputs.cache-hit == 'true' && format('{0}/prepared.qcow2', github.workspace) || '' }}
          # a version tag and a run by hand also try an update and Revert; main stays fast
          KB_OS_UPDATE: ${{ (inputs.fast || inputs.from_last_release) && '0' || '1' }}
          KB_OS_FROM: ${{ steps.from.outputs.image }}
          KB_OS_SECURE_BOOT: ${{ inputs.secure_boot && '1' || '0' }}
          # early: QEMU from the last published main build; the build to install is waited for once
          # the machine is up (scripts/ci_wait_build.sh fails as soon as the build job fails)
          KB_OS_VM_IMAGE: ${{ steps.build.outputs.image == '--wait' && 'ghcr.io/fr0styx/kiboto:main' || '' }}
          KB_OS_IMAGE_CMD: sh scripts/ci_wait_build.sh digest-full "Build multi-arch image (full)"
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/os_install_check.sh "$IMAGE_REF"

      - name: Prepare a disk for the next runs
        if: inputs.fast && !inputs.from_last_release && !inputs.secure_boot && steps.prepared.outputs.cache-hit != 'true'
        env:
          IMAGE_REF: ${{ steps.build.outputs.image }}
          KB_OS_PREPARE: ${{ github.workspace }}/prepared.qcow2
          KB_OS_VM_IMAGE: ${{ steps.build.outputs.image == '--wait' && 'ghcr.io/fr0styx/kiboto:main' || '' }}
          KB_OS_IMAGE_CMD: sh scripts/ci_wait_build.sh digest-full "Build multi-arch image (full)"
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/os_install_check.sh "$IMAGE_REF"

      - name: Keep the prepared disk
        if: inputs.fast && !inputs.from_last_release && !inputs.secure_boot && steps.prepared.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: prepared.qcow2
          key: ${{ steps.key.outputs.key }}
