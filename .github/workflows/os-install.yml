name: Kiboto OS install check

# Installs Kiboto OS for real. A fresh Debian 13 starts as a virtual machine on the runner, this
# checkout's install script installs the build named by its digest, and the result is looked at,
# before and after a restart (scripts/os_install_check.sh). The repository's other tests about
# Kiboto OS read its scripts as text; this is the one that runs them.
# It can be started by hand for any published build, and CI calls it for the build it just made.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "The build to install: ghcr.io/fr0styx/kiboto@sha256:..."
        required: true
        type: string
  workflow_call:
    inputs:
      image:
        description: "The build to install, by digest. Empty: the full image the calling run built."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  install:
    name: Kiboto OS installs and runs
    runs-on: ubuntu-latest
    timeout-minutes: 45  # ARC-26: a hung step fails the run instead of holding a runner for 6 hours
    permissions:
      contents: read
      packages: read # the image is pulled by its digest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: The runner can start virtual machines
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error title=No virtual machines here::This runner has no /dev/kvm, so Kiboto OS cannot be installed in a virtual machine on it."
            exit 1
          fi
          ls -l /dev/kvm

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the digest
        if: inputs.image == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-full

      - name: Which build
        id: build
        env:
          GIVEN: ${{ inputs.image }}
        run: |
          if [ -n "$GIVEN" ]; then image=$GIVEN; else image="ghcr.io/fr0styx/kiboto@$(cat digest.txt)"; fi
          # only one of Kiboto's own builds, named by its digest: nothing else is ever installed here
          if ! printf '%s' "$image" | grep -Eq '^ghcr\.io/fr0styx/kiboto@sha256:[0-9a-f]{64}$'; then
            echo "::error title=Not a Kiboto build::Name the build as ghcr.io/fr0styx/kiboto@sha256:<digest>."
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Install Kiboto OS in a fresh Debian 13 and check it
        env:
          IMAGE_REF: ${{ steps.build.outputs.image }}
        run: sh scripts/os_install_check.sh "$IMAGE_REF"
