// Kiboto OS: Debian's security fixes are installed by themselves, every day, the kernel included.
// Kiboto never restarts the machine for them; its Updates page says when a restart finishes one.
// ZFS and Docker stay held and move with Kiboto releases. Written by Kiboto at each start;
// KIBOTO_SECURITY_UPDATES=0 turns this off.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
// Debian's own list also takes its point releases; this one is the security archive only
#clear Unattended-Upgrade::Origins-Pattern;
Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
};
Unattended-Upgrade::Automatic-Reboot "false";
