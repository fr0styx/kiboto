# Kiboto's install image: Debian's own installer, answered except for two questions.
# Asked every time: which disk becomes the system disk (and whether to write to it), and the
# root password. Everything else is set here; Kiboto itself is installed at the first start.

# language, keyboard, clock (the time zone is chosen later in Kiboto)
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

# network: the address from the router; Kiboto's install moves it to systemd-networkd
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string kiboto
d-i netcfg/hostname string kiboto
d-i netcfg/get_domain string
d-i netcfg/wireless_wep string

# Debian's own mirror; contrib for ZFS, non-free-firmware for drivers
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
# no other installation media to scan
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

# accounts: root, with the password typed during the install; no other account (people are made in Kiboto)
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false

# the system disk: the installer asks which one, then shows it and asks before writing.
# The whole chosen disk becomes Debian's; no other disk is touched.
d-i partman-auto/init_automatically_partition select some_device
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
# partman/confirm and partman/confirm_nooverwrite are left to the person: the installer always
# shows the disk and asks before writing, also when the disk is empty

# software: the standard system and SSH; nothing else (Kiboto installs what it needs)
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# boot loader on the chosen disk
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Kiboto at the first start; the machine restarts when the installer is done
d-i preseed/late_command string sh /cdrom/kiboto/late.sh
d-i finish-install/reboot_in_progress note
